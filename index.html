<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Inter', sans-serif;

    background:
        linear-gradient(135deg, #0b0b0f, #15151c 50%, #0b0b0f);
}



        .container {
            width: 350px;
            padding: 22px;

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;

            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;

            color: #777;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo {
            color: #fff;
            font-weight: 600;
        }

        .display {
            height: 125px;

            display: flex;
            justify-content: flex-end;
            align-items: flex-end;

            padding: 10px 5px 20px;

            color: #fff;
            font-size: 58px;
            font-weight: 500;

            overflow: hidden;
        }

        .number {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 11px;
        }

        button {
            width: 68px;
            height: 68px;

            border: none;
            border-radius: 22px;

            color: white;
            background: #202024;

            font-family: inherit;
            font-size: 21px;
            font-weight: 500;

            cursor: pointer;

            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.05);

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        button:hover {
            background: #29292f;

            transform: translateY(-3px);

            box-shadow:
                0 12px 22px rgba(0, 0, 0, 0.35);
        }

        button:active {
            transform: scale(0.92);
        }

        /* Gray buttons */

        .n1 {
            color: #e5e5e5;

            background: linear-gradient(
                145deg,
                #55555c,
                #3b3b40
            );
        }

        .n1:hover {
            background: linear-gradient(
                145deg,
                #64646b,
                #45454b
            );
        }

        /* Orange buttons */

        .n2 {
            background: linear-gradient(
                145deg,
                #ffb52e,
                #ff7a00
            );

            box-shadow:
                0 8px 20px rgba(255, 132, 0, 0.25);
        }

        .n2:hover {
            background: linear-gradient(
                145deg,
                #ffc04d,
                #ff8a1a
            );

            box-shadow:
                0 12px 25px rgba(255, 132, 0, 0.35);
        }

        /* Dark buttons */

        .n3 {
            background: linear-gradient(
                145deg,
                #29292e,
                #19191d
            );
        }

        /* Equal button */

        .n2:last-child {
            background: linear-gradient(
                145deg,
                #ffca52,
                #ff7800
            );
        }

        /* Zero */

        .number button:nth-child(18) {
            grid-column: span 1;
        }

        /* Mobile */

        @media (max-width: 400px) {

            .container {
                width: 92%;
                padding: 18px;
            }

            button {
                width: 100%;
                height: 62px;
                border-radius: 19px;
            }

            .display {
                font-size: 48px;
                height: 110px;
            }

            .number {
                gap: 9px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top">
            <span class="logo">CALCULATOR</span>
        </div>

        <div class="display">
            <h3>0</h3>
        </div>

        <div class="number">

            <button class="n1">×</button>
            <button class="n1">AC</button>
            <button class="n1">%</button>
            <button class="n2">/</button>

            <button class="n3">7</button>
            <button class="n3">8</button>
            <button class="n3">9</button>
            <button class="n2">*</button>

            <button class="n3">4</button>
            <button class="n3">5</button>
            <button class="n3">6</button>
            <button class="n2">−</button>

            <button class="n3">1</button>
            <button class="n3">2</button>
            <button class="n3">3</button>
            <button class="n2">+</button>

            <button class="n3">+/-</button>
            <button class="n3">0</button>
            <button class="n3">.</button>
            <button class="n2">=</button>

        </div>

    </div>
<script>

    let display = document.querySelector('.display h3');
    let buttons = document.querySelectorAll('button');

    buttons.forEach(button => {

        button.addEventListener('click', () => {

            // Raqamlarni chiqarish
            if (!isNaN(button.textContent)) {

                if (display.textContent === "0") {
                    display.textContent = button.textContent;
                }
                else {
                    display.textContent += button.textContent;
                }
            }

            // AC - hammasini o'chirish
            if (button.textContent === 'AC') {
                display.textContent = "0";
            }

            // Qo'shish
            else if (button.textContent === '+') {
                display.textContent += '+';
            }

            // Ayirish
            else if (button.textContent === '−') {
                display.textContent += '-';
            }

            // Bo'lish
            else if (button.textContent === '÷') {
                display.textContent += '/';
            }

            // Nuqta
            else if (button.textContent === '.') {
                display.textContent += '.';
            }

            // Foiz
            else if (button.textContent === '%') {
                display.textContent =
                    eval(display.textContent) / 100;
            }

            // = hisoblash
            else if (button.textContent === '=') {

                try {
                    display.textContent =
                        eval(display.textContent);
                }
                catch {
                    display.textContent = "Error";
                }
            }

            // × - faqat 1 ta belgini o'chirish
            else if (button.textContent === '×') {

                display.textContent =
                    display.textContent.slice(0, -1);

                // Agar hammasi o'chib ketsa 0 bo'ladi
                if (display.textContent === '') {
                    display.textContent = '0';
                }
            }

        });

    });

</script>
</body>
</html>
